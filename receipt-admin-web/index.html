<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MarkenDetektive — Bon-Matching Review</title>
    <style>
      :root {
        --bg: #0f1214; --card: #1a1f23; --card2: #20262b; --line: #2c343a;
        --text: #e7edf1; --muted: #9aa7b0; --brand: #0d8575; --brand2: #14b8a6;
        --warn: #e0a106; --bad: #e0524b; --good: #2bb673; --tier2: #5b4f9c;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: rgba(15,18,20,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
      header h1 { font-size: 16px; margin: 0; font-weight: 800; letter-spacing: -.2px; }
      .stats { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
      .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px; font-size: 12px; }
      .stat b { color: var(--brand2); font-size: 14px; }
      button { font: inherit; cursor: pointer; border: 0; border-radius: 9px; padding: 8px 13px; background: var(--card2); color: var(--text); border: 1px solid var(--line); }
      button:hover { border-color: var(--brand); }
      button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 700; }
      button.bad { background: transparent; border-color: var(--bad); color: var(--bad); }
      button.ghost { background: transparent; }
      .tabs { display: flex; gap: 8px; padding: 14px 20px 0; }
      .tab { padding: 8px 14px; border-radius: 10px 10px 0 0; border: 1px solid var(--line); border-bottom: 0; background: var(--card); color: var(--muted); }
      .tab.active { background: var(--card2); color: var(--text); font-weight: 700; }
      main { padding: 14px 20px 60px; max-width: 1100px; margin: 0 auto; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
      .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .title { font-size: 17px; font-weight: 800; letter-spacing: -.2px; }
      .chip { font-size: 11px; padding: 3px 8px; border-radius: 8px; background: var(--card2); border: 1px solid var(--line); color: var(--muted); }
      .chip.price { color: var(--brand2); } .chip.hits { color: var(--warn); }
      .chip.conf { color: #fff; background: var(--warn); border-color: var(--warn); }
      .cands { margin-top: 12px; display: grid; gap: 6px; max-height: 430px; overflow-y: auto; padding-right: 4px; }
      .cands::-webkit-scrollbar { width: 8px; } .cands::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
      .cand { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--card2); cursor: pointer; }
      .cand:hover { border-color: var(--brand); }
      .cand.sel { border-color: var(--brand2); box-shadow: 0 0 0 1px var(--brand2) inset; }
      .cand.suggest { border-color: var(--warn); }
      .cand .nm { flex: 1; }
      .thumb { width: 34px; height: 34px; border-radius: 7px; object-fit: contain; background: #fff; flex: 0 0 auto; }
      .thumb.ph { background: var(--card); border: 1px dashed var(--line); }
      .nm .brand { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
      .badge.nn { color: #f0c674; border-color: #6b5a2a; }
      .badge.mk { color: #7fc7ff; border-color: #2a5a7a; }
      .noSuggest { margin-top: 10px; color: var(--warn); font-size: 13px; font-weight: 600; }
      .dtoggle { margin-top: 10px; font-size: 12px; color: var(--brand2); cursor: pointer; user-select: none; }
      .details { margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--card2); }
      .kv { display: grid; grid-template-columns: 150px 1fr; gap: 4px 10px; font-size: 13px; }
      .kv .k { color: var(--muted); } .kv .v { color: var(--text); word-break: break-word; }
      .hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
      .filterpills { display: flex; gap: 6px; margin-top: 8px; }
      .fp { font-size: 12px; padding: 4px 11px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); cursor: pointer; }
      .fp.active { background: var(--card2); color: var(--text); border-color: var(--brand); font-weight: 700; }
      .brandfilter { font-size: 12px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card2); color: var(--text); max-width: 260px; cursor: pointer; }
      .eanbtn { font-size: 11px; padding: 4px 9px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--muted); flex: 0 0 auto; cursor: pointer; }
      .eanbtn.on { color: var(--brand2); border-color: var(--brand2); background: rgba(20,184,166,.1); }
      .mergeinfo { font-size: 12px; margin-top: 8px; }
      .badge { font-size: 10px; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
      .badge.t1 { color: var(--good); border-color: var(--good); }
      .badge.t2 { color: #b9aef0; border-color: var(--tier2); }
      .actions { margin-top: 13px; display: flex; gap: 8px; flex-wrap: wrap; }
      .search { margin-top: 10px; display: flex; gap: 8px; }
      .search input { flex: 1; background: var(--card2); border: 1px solid var(--line); color: var(--text); border-radius: 9px; padding: 8px 11px; }
      .muted { color: var(--muted); } .empty { color: var(--muted); padding: 40px; text-align: center; }
      #login { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 80px 20px; }
      .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--card2); border: 1px solid var(--brand); border-radius: 12px; padding: 10px 16px; opacity: 0; transition: opacity .2s; z-index: 10; }
      .toast.show { opacity: 1; }
      .hidden { display: none !important; }
      .thumb[data-full] { cursor: zoom-in; }
      #zoom { position: fixed; z-index: 60; pointer-events: none; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 8px; box-shadow: 0 14px 50px rgba(0,0,0,.55); display: none; }
      #zoom img { display: block; width: 340px; height: 340px; object-fit: contain; }
      #zoom .zname { position: absolute; bottom: 8px; left: 8px; right: 8px; font-size: 12px; font-weight: 700; color: #191c1d; background: rgba(255,255,255,.82); border-radius: 8px; padding: 4px 8px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="login">
      <h1>🧾 Bon-Matching Review</h1>
      <p class="muted">Admin-Login</p>
      <input id="loginEmail" type="email" placeholder="E-Mail" autocomplete="username" style="width:280px;max-width:90vw;background:#20262b;border:1px solid #2c343a;color:#e7edf1;border-radius:9px;padding:10px 12px" />
      <input id="loginPw" type="password" placeholder="Passwort" autocomplete="current-password" style="width:280px;max-width:90vw;background:#20262b;border:1px solid #2c343a;color:#e7edf1;border-radius:9px;padding:10px 12px" />
      <button class="primary" id="loginBtn" style="width:280px;max-width:90vw">Anmelden</button>
      <p class="muted" id="loginMsg"></p>
    </div>

    <div id="app" class="hidden">
      <header>
        <h1>🧾 Bon-Matching Review</h1>
        <div class="stats" id="stats"></div>
        <button class="ghost" id="refreshBtn">↻ Neu laden</button>
        <button class="ghost" id="logoutBtn" title="Abmelden">⏻</button>
      </header>
      <div class="tabs">
        <div class="tab active" data-tab="review" id="tabReview">Review-Queue</div>
        <div class="tab" data-tab="promotion" id="tabPromo">Promotion (reweapify)</div>
        <div class="tab" data-tab="matched" id="tabMatched">Zugeordnet</div>
      </div>
      <main>
        <div id="list"></div>
      </main>
    </div>
    <div class="toast" id="toast"></div>
    <div id="zoom"><img alt="" /><div class="zname"></div></div>

    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
      import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
      import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js';

      const app = initializeApp({
        apiKey: 'AIzaSyCVQ-Y71TNexRKSWrVtu1HTP9uk_dSfUP0',
        authDomain: 'markendetektive-895f7.firebaseapp.com',
        projectId: 'markendetektive-895f7',
        storageBucket: 'markendetektive-895f7.appspot.com',
        messagingSenderId: '139509881339',
        appId: '1:139509881339:web:d5d1f2b75d2b0258d6135e',
      });
      const auth = getAuth(app);
      const fns = getFunctions(app, 'europe-west1');
      const call = (name) => httpsCallable(fns, name);

      const $ = (id) => document.getElementById(id);
      let state = { tab: 'review', data: { review: [], promotion: [], stats: {} } };

      function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

      // Hover-Zoom-Overlay: großes Produktbild folgt dem Cursor, wechselt sofort
      // beim Überfahren des nächsten Produkts.
      const zoom = $('zoom'), zoomImg = zoom.querySelector('img'), zoomName = zoom.querySelector('.zname');
      function placeZoom(e) { const w = 356, h = 356; let x = e.clientX + 26, y = e.clientY - h / 2; if (x + w > innerWidth) x = e.clientX - w - 26; if (x < 8) x = 8; if (y < 8) y = 8; if (y + h > innerHeight) y = innerHeight - h - 8; zoom.style.left = x + 'px'; zoom.style.top = y + 'px'; }
      document.addEventListener('mouseover', (e) => {
        const t = e.target.closest && e.target.closest('.thumb[data-full]');
        if (!t) return;
        zoomImg.src = t.getAttribute('data-full');
        const nm = (t.closest('.cand') && t.closest('.cand').querySelector('.nm')) || (t.parentElement && t.parentElement.querySelector('.title'));
        zoomName.textContent = nm ? nm.textContent : '';
        zoom.style.display = 'block';
        placeZoom(e);
      });
      document.addEventListener('mousemove', (e) => { if (zoom.style.display === 'block') placeZoom(e); });
      document.addEventListener('mouseout', (e) => {
        const t = e.target.closest && e.target.closest('.thumb[data-full]');
        if (t && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('.thumb[data-full]'))) zoom.style.display = 'none';
      });

      $('loginBtn').onclick = async () => {
        $('loginMsg').textContent = '';
        try { await signInWithEmailAndPassword(auth, $('loginEmail').value.trim(), $('loginPw').value); }
        catch (e) { $('loginMsg').textContent = e.code === 'auth/invalid-credential' ? 'E-Mail oder Passwort falsch.' : e.message; }
      };
      $('loginPw').onkeydown = (e) => { if (e.key === 'Enter') $('loginBtn').click(); };
      $('logoutBtn').onclick = () => signOut(auth);
      $('refreshBtn').onclick = load;
      $('tabReview').onclick = () => { state.tab = 'review'; render(); };
      $('tabPromo').onclick = () => { state.tab = 'promotion'; render(); };
      $('tabMatched').onclick = () => { state.tab = 'matched'; render(); };

      onAuthStateChanged(auth, async (user) => {
        if (!user) { $('login').classList.remove('hidden'); $('app').classList.add('hidden'); return; }
        const tok = await user.getIdTokenResult(true);
        if (tok.claims.admin !== true) {
          $('loginMsg').textContent = `${user.email} ist kein Admin. (Custom-Claim admin:true fehlt)`;
          $('login').classList.remove('hidden'); $('app').classList.add('hidden');
          await signOut(auth); return;
        }
        $('login').classList.add('hidden'); $('app').classList.remove('hidden');
        load();
      });

      async function load() {
        $('list').innerHTML = '<div class="empty">Lade…</div>';
        try {
          const [q, m] = await Promise.all([call('adminGetQueue')(), call('adminGetMatched')()]);
          state.data = q.data;
          state.data.matched = m.data.matched || [];
          state.data.stats.matched = m.data.total || 0;
          render();
        } catch (e) { $('list').innerHTML = `<div class="empty">Fehler: ${e.message}</div>`; }
      }

      function render() {
        const s = state.data.stats || {};
        $('stats').innerHTML =
          `<div class="stat">Review <b>${s.openReview ?? 0}</b></div>` +
          `<div class="stat">Promotion <b>${s.openPromotion ?? 0}</b></div>` +
          `<div class="stat">Zugeordnet <b>${s.matched ?? 0}</b></div>` +
          `<div class="stat">Aliase <b>${(s.aliases ?? 0).toLocaleString('de-DE')}</b></div>`;
        $('tabReview').classList.toggle('active', state.tab === 'review');
        $('tabPromo').classList.toggle('active', state.tab === 'promotion');
        $('tabMatched').classList.toggle('active', state.tab === 'matched');
        $('list').innerHTML = '';
        const items = state.tab === 'review' ? state.data.review : state.tab === 'promotion' ? state.data.promotion : state.data.matched;
        if (!items || !items.length) { $('list').innerHTML = '<div class="empty">Nichts hier 🎉</div>'; return; }
        const make = state.tab === 'review' ? reviewCard : state.tab === 'promotion' ? promoCard : matchedCard;
        items.forEach((it) => $('list').appendChild(make(it)));
      }

      function euro(cents) { return cents != null ? (cents / 100).toFixed(2).replace('.', ',') + ' €' : '—'; }
      function marketLabel(it) { const m = it.market || {}; const name = m.name || it.marktSlug || '?'; return esc(name + (m.land ? ' · ' + m.land : '')); }
      function marketLabelPlain(it) { const m = it.market || {}; const name = m.name || it.marktSlug || '?'; return name + (m.land ? ' · ' + m.land : ''); }
      function marketRaw(it) { const m = it.market || {}; return m.raw ? `<div class="muted" style="margin-top:5px;font-size:12px">📍 ${esc(m.raw)}</div>` : ''; }
      function fmtDate(d) { if (!d) return null; try { const dt = new Date(d); if (isNaN(dt)) return String(d); return dt.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }); } catch (e) { return String(d); } }
      function kv(pairs) { const rows = pairs.filter(([, v]) => v != null && v !== '').map(([k, v]) => `<div class="k">${esc(k)}</div><div class="v">${esc(v)}</div>`).join(''); return `<div class="kv">${rows}</div>`; }
      // Ausklappbarer Detail-Block.
      function detailsToggle(el, label, html) {
        const t = document.createElement('div'); t.className = 'dtoggle'; t.textContent = '▸ ' + label;
        const d = document.createElement('div'); d.className = 'details hidden'; d.innerHTML = html;
        t.onclick = () => { const open = d.classList.toggle('hidden'); t.textContent = (open ? '▸ ' : '▾ ') + label; };
        el.appendChild(t); el.appendChild(d);
      }
      function tierBadge(c) { return c.tier === 2 || c.source === 'reweapify' ? '<span class="badge t2">reweapify</span>' : '<span class="badge t1">Katalog</span>'; }
      function typeBadge(c) { return c.type === 'noname' ? '<span class="badge nn">NoName</span>' : '<span class="badge mk">Marke</span>'; }
      function thumbHtml(image) { return image ? `<img class="thumb" src="${esc(image)}" data-full="${esc(image)}" referrerpolicy="no-referrer" onerror="this.classList.add('ph');this.removeAttribute('src');this.removeAttribute('data-full')"/>` : '<div class="thumb ph"></div>'; }
      function anchorBadge(c) { return c.personal ? `<span class="badge" style="color:#f0c674;border-color:#6b5a2a">★ ${esc(c.reason || 'Zettel')}</span>` : ''; }
      function matchBadge(c) { if (c.dist == null) return ''; const p = Math.max(0, Math.round((1 - c.dist) * 100)); const col = p >= 80 ? '#2bb673' : p >= 60 ? '#e0a106' : '#9aa7b0'; return `<span class="badge" style="color:${col};border-color:${col}">${p}%</span>`; }
      function marketCandBadge(c) { if (!c.market) return ''; const col = c.sameMarket ? '#2bb673' : '#9aa7b0'; return `<span class="badge" style="color:${col};border-color:${col}" title="Markt">${c.sameMarket ? '✓ ' : ''}🏬${esc(c.market)}</span>`; }
      function candInner(c) {
        const sub = c.handelsmarke || c.brand || '';
        const subLine = sub || c.size ? `<span class="brand">${esc(sub)}${sub && c.size ? ' · ' : ''}${c.size ? esc(c.size) : ''}</span>` : '';
        return thumbHtml(c.image) + `<span class="nm">${esc(c.name)}${subLine}</span>` + anchorBadge(c) + marketCandBadge(c) + typeBadge(c) + tierBadge(c) + matchBadge(c) + `<span class="muted">${c.preis != null ? Number(c.preis).toFixed(2) + '€' : ''}</span>`;
      }

      function reviewCard(it) {
        const el = document.createElement('div'); el.className = 'card';
        let selected = null;
        const cands = it.candidates || [];
        el.innerHTML =
          `<div class="row"><span class="title">${esc(it.sampleName || '')}</span>` +
          `<span class="chip" title="Markt">🏬 ${marketLabel(it)}</span>` +
          `<span class="chip price">${euro(it.priceCents)}</span>` +
          (it.bonSize ? `<span class="chip">${esc(it.bonSize)}</span>` : '') +
          `<span class="chip hits">${it.hitCount || 1}× gesehen</span>` +
          (it.confidence != null ? `<span class="chip conf">KI ${Math.round(it.confidence * 100)}%</span>` : '') +
          `</div>` +
          marketRaw(it);
        const hasSuggest = it.suggestionIdx != null && it.suggestionIdx >= 0;
        if (!hasSuggest) { const w = document.createElement('div'); w.className = 'noSuggest'; w.textContent = '⚠ KI: kein sicherer Treffer — bitte manuell zuordnen oder „Kein Produkt".'; el.appendChild(w); }
        const picker = searchPicker();
        const list = document.createElement('div'); list.className = 'cands';
        cands.forEach((c, i) => {
          const d = document.createElement('div');
          d.className = 'cand' + (hasSuggest && i === it.suggestionIdx ? ' suggest' : '');
          d.innerHTML = candInner(c) + `<button class="eanbtn">+EAN</button>`;
          d.querySelector('.eanbtn').onclick = (e) => { e.stopPropagation(); const m = picker.getMerge(); const has = m.some((x) => x.id === c.id); picker.setMerge(c, !has); d.querySelector('.eanbtn').classList.toggle('on', !has); };
          d.onclick = () => { picker.setMain({ productId: c.id, productSource: c.source, name: c.name }); [...list.children].forEach((x) => x.classList.remove('sel')); d.classList.add('sel'); };
          list.appendChild(d);
        });
        el.appendChild(list);
        el.appendChild(picker.el);

        detailsToggle(el, 'Details', kv([
          ['Bon-Zeile', it.sampleName], ['Markt', marketLabelPlain(it)], ['Filiale', (it.market || {}).raw],
          ['Preis', it.priceCents != null ? euro(it.priceCents) : null], ['Größe/Menge', it.bonSize], ['Bon-Datum', fmtDate(it.bonDate)],
          ['KI-Confidence', it.confidence != null ? Math.round(it.confidence * 100) + '%' : null], ['Häufigkeit', (it.hitCount || 1) + '×'],
          ['Kandidaten', (it.candidates || []).length], ['normKey', it.normKey],
        ]));

        const act = document.createElement('div'); act.className = 'actions';
        const assign = mkBtn('✓ Zuordnen', 'primary', async () => {
          const main = picker.getMain();
          if (!main) return toast('Erst ein Hauptprodukt wählen (Kandidat anklicken oder suchen)');
          await resolve(it, { productId: main.productId, productSource: main.productSource, lineType: 'product', mergeEanFrom: picker.getMerge() }, el);
        });
        act.appendChild(assign);
        act.appendChild(mkBtn('Kein Produkt', 'ghost', () => resolve(it, { productId: null, lineType: 'nonproduct' }, el)));
        act.appendChild(mkBtn('Pfand', 'ghost', () => resolve(it, { productId: null, lineType: 'pfand' }, el)));
        el.appendChild(act);
        return el;
      }

      async function resolve(it, payload, el) {
        try {
          const r = await call('adminResolveReview')({ reviewId: it.id, ...payload });
          toast(`Gespeichert · ${r.data.relinked} Bons${r.data.promoted ? ' · Produkt angelegt' : ''}${r.data.mergedEans ? ` · ${r.data.mergedEans} EAN(s) ergänzt` : ''}`);
          el.remove(); state.data.review = state.data.review.filter((x) => x.id !== it.id);
          state.data.stats.openReview = Math.max(0, (state.data.stats.openReview || 1) - 1); render();
        } catch (e) { toast('Fehler: ' + e.message); }
      }

      function promoCard(it) {
        const el = document.createElement('div'); el.className = 'card';
        el.innerHTML =
          `<div class="row">${thumbHtml(it.image)}<span class="title">${esc(it.name || it.sampleName || '')}</span>` +
          `<span class="badge t2">reweapify</span>` +
          `<span class="badge">${it.kind === 'noname' ? 'NoName→produkte' : 'Marke→markenProdukte'}</span>` +
          (it.gtin ? `<span class="chip">EAN ${esc(it.gtin)}</span>` : '') +
          `<span class="chip hits">${it.hitCount || 1}×</span>` +
          (it.confidence != null ? `<span class="chip conf">KI ${Math.round(it.confidence * 100)}%</span>` : '') +
          `<span class="chip" title="Markt">🏬 ${marketLabel(it)}</span>` +
          `</div>` +
          `<div class="muted" style="margin-top:6px">Standard: wird als <b>neues ${it.kind === 'noname' ? 'NoName-Produkt (produkte)' : 'Marken-Produkt (markenProdukte)'}</b> angelegt. Bon-Zeile: „${esc(it.sampleName || '')}"</div>` +
          marketRaw(it);
        const picker = searchPicker();
        const corr = document.createElement('div'); corr.className = 'hidden';
        corr.insertAdjacentHTML('afterbegin', '<div class="hint" style="margin-bottom:6px">Optional: ein <b>anderes Hauptprodukt</b> wählen (dann fließt nur die EAN dieses reweapify-Treffers dorthin), und/oder per „+EAN" weitere Duplikate zusammenführen.</div>');
        corr.appendChild(picker.el);
        el.appendChild(corr);
        const act = document.createElement('div'); act.className = 'actions';
        act.appendChild(mkBtn('✎ Zusammenführen / anderes Hauptprodukt', 'ghost', () => corr.classList.toggle('hidden')));
        act.appendChild(mkBtn('✓ In Katalog übernehmen', 'primary', async () => {
          const m = picker.getMain();
          const payload = { promotionId: it.id, approve: true, mergeEanFrom: picker.getMerge() };
          if (m) { payload.mainProductId = m.productId; payload.mainProductSource = m.productSource; }
          try { const r = await call('adminPromote')(payload);
            toast(`${m ? 'Zusammengeführt' : 'Übernommen'} → ${r.data.targetCol}${r.data.mergedEans ? ` · ${r.data.mergedEans} EAN(s)` : ''} · ${r.data.relinked} Bons`);
            el.remove(); state.data.promotion = state.data.promotion.filter((x) => x.id !== it.id);
            state.data.stats.openPromotion = Math.max(0, (state.data.stats.openPromotion || 1) - 1); render();
          } catch (e) { toast('Fehler: ' + e.message); } }));
        act.appendChild(mkBtn('Ablehnen', 'bad', async () => {
          try { await call('adminPromote')({ promotionId: it.id, approve: false });
            el.remove(); state.data.promotion = state.data.promotion.filter((x) => x.id !== it.id);
            state.data.stats.openPromotion = Math.max(0, (state.data.stats.openPromotion || 1) - 1); render();
          } catch (e) { toast('Fehler: ' + e.message); } }));
        el.appendChild(act);
        return el;
      }

      function matchedCard(it) {
        const el = document.createElement('div'); el.className = 'card';
        let selected = null;
        const p = it.product || {};
        const rb = it.resolvedBy || '';
        const byWho = rb.startsWith('admin') ? '👤 Mensch' : rb === 'alias' ? '↻ Lexikon' : rb === 'rule' ? 'Regel' : '🤖 KI';
        el.innerHTML =
          `<div class="row"><span class="title">${esc(it.sampleName || '')}</span>` +
          `<span class="chip" title="Markt">🏬 ${marketLabel(it)}</span>` +
          (it.confidence != null ? `<span class="chip conf">${Math.round(it.confidence * 100)}%</span>` : '') +
          `<span class="chip">${byWho}</span>` +
          `<span class="chip hits">${it.votes || 1}×</span>` +
          `</div>` +
          marketRaw(it);
        const prow = document.createElement('div'); prow.className = 'cands';
        const pd = document.createElement('div'); pd.className = 'cand sel'; pd.style.cursor = 'default';
        pd.innerHTML = `<span class="muted" style="flex:0 0 auto;font-weight:800">→</span>` + candInner(p);
        prow.appendChild(pd); el.appendChild(prow);
        const picker = searchPicker();
        const corr = document.createElement('div'); corr.className = 'hidden';
        corr.appendChild(picker.el);
        el.appendChild(corr);
        const b = it.bon || {};
        detailsToggle(el, 'Details', kv([
          ['Bon-Zeile', it.sampleName], ['Markt', marketLabelPlain(it)], ['Filiale', (it.market || {}).raw],
          ['Bon-Preis', b.priceCents != null ? euro(b.priceCents) : null], ['Bon-Größe', b.bonSize], ['Bon-Datum', fmtDate(b.bonDate)],
          ['Produkt', p.name], ['Marke/Handelsmarke', p.handelsmarke || p.brand], ['Hersteller', p.manufacturer], ['Größe', p.size],
          ['Katalog-Preis', p.preis != null ? Number(p.preis).toFixed(2).replace('.', ',') + ' €' : null], ['EAN', p.gtin],
          ['Typ', p.type === 'noname' ? 'NoName (Eigenmarke)' : 'Marke'], ['Quelle', p.source],
          ['KI-Confidence', it.confidence != null ? Math.round(it.confidence * 100) + '%' : null], ['Zugeordnet von', it.resolvedBy], ['Häufigkeit', (it.votes || 1) + '×'],
        ]));
        const act = document.createElement('div'); act.className = 'actions';
        act.appendChild(mkBtn('✎ Korrigieren', 'ghost', () => corr.classList.toggle('hidden')));
        act.appendChild(mkBtn('✓ Neues Produkt übernehmen', 'primary', () => { const m = picker.getMain(); if (!m) return toast('Erst ein Hauptprodukt suchen + wählen'); correct(it, { productId: m.productId, productSource: m.productSource, lineType: 'product', mergeEanFrom: picker.getMerge() }, el); }));
        act.appendChild(mkBtn('Falsch / kein Produkt', 'bad', () => correct(it, { productId: null, lineType: 'nonproduct' }, el)));
        el.appendChild(act);
        return el;
      }
      async function correct(it, payload, el) {
        try { const r = await call('adminCorrectMatch')({ aliasId: it.aliasId, ...payload }); toast(`Aktualisiert · ${r.data.relinked} Bons${r.data.promoted ? ' · Produkt angelegt' : ''}${r.data.mergedEans ? ` · ${r.data.mergedEans} EAN(s) ergänzt` : ''}`); el.remove(); state.data.matched = state.data.matched.filter((x) => x.aliasId !== it.aliasId); state.data.stats.matched = Math.max(0, (state.data.stats.matched || 1) - 1); render(); }
        catch (e) { toast('Fehler: ' + e.message); }
      }
      // Gemeinsamer Such-Picker: Filter (Alle/NoName/Marke) · Klick = Hauptprodukt ·
      // „+EAN" = nur EAN(s) eines Duplikats zum Hauptprodukt mergen.
      function searchPicker() {
        let main = null; const merge = new Map(); let results = []; let filter = 'all'; let brandFilter = '';
        const el = document.createElement('div');
        el.innerHTML =
          `<div class="search"><input placeholder="Richtiges Produkt suchen (Name/Marke)…"/><button>Suchen</button></div>` +
          `<div class="filterpills"><span class="fp active" data-f="all">Alle</span><span class="fp" data-f="noname">NoName</span><span class="fp" data-f="marke">Marke</span><select class="brandfilter"><option value="">Alle Marken/Handelsmarken</option></select></div>` +
          `<div class="hint">reweapify-Treffer werden beim Zuordnen automatisch angelegt (Marke→markenProdukte, Eigenmarke→produkte). „+EAN" fügt nur die EAN(s) eines Duplikats zum Hauptprodukt hinzu.</div>` +
          `<div class="cands sres"></div><div class="mergeinfo"></div>`;
        const inp = el.querySelector('input'), sres = el.querySelector('.sres'), info = el.querySelector('.mergeinfo'), bsel = el.querySelector('.brandfilter');
        const brandOf = (c) => c.handelsmarke || c.brand || '';
        const populateBrands = () => {
          const brands = [...new Set(results.map(brandOf).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'de'));
          bsel.innerHTML = '<option value="">Alle Marken/Handelsmarken (' + brands.length + ')</option>' + brands.map((b) => `<option value="${esc(b)}">${esc(b)}</option>`).join('');
          brandFilter = '';
        };
        bsel.onchange = () => { brandFilter = bsel.value; renderResults(); };
        const renderInfo = () => {
          const m = [...merge.values()];
          info.innerHTML = (main ? `Hauptprodukt: <b>${esc(main.name || '?')}</b>` : '<span style="color:var(--warn)">Noch kein Hauptprodukt gewählt</span>') + (m.length ? ` · <span class="muted">+EAN von:</span> ${m.map((x) => esc(x.name || '?')).join(', ')}` : '');
        };
        const renderResults = () => {
          sres.innerHTML = '';
          const list = results.filter((c) => (filter === 'all' || (filter === 'noname' ? c.type === 'noname' : c.type !== 'noname')) && (!brandFilter || brandOf(c) === brandFilter));
          if (!list.length) { sres.innerHTML = '<div class="muted">Keine Treffer.</div>'; return; }
          list.forEach((c) => {
            const row = document.createElement('div'); row.className = 'cand';
            if (main && main.productId === c.id) row.classList.add('sel');
            row.innerHTML = candInner(c) + `<button class="eanbtn${merge.has(c.id) ? ' on' : ''}">+EAN</button>`;
            row.querySelector('.eanbtn').onclick = (e) => { e.stopPropagation(); merge.has(c.id) ? merge.delete(c.id) : merge.set(c.id, { id: c.id, source: c.source, name: c.name }); renderResults(); renderInfo(); };
            row.onclick = () => { main = { productId: c.id, productSource: c.source, name: c.name }; renderResults(); renderInfo(); };
            sres.appendChild(row);
          });
        };
        const doSearch = async () => { if (!inp.value.trim()) return; sres.innerHTML = '<div class="muted">Suche…</div>'; try { const r = await call('adminSearchProducts')({ query: inp.value.trim() }); results = r.data.results || []; populateBrands(); renderResults(); } catch (e) { sres.innerHTML = `<div class="muted">Fehler: ${e.message}</div>`; } };
        el.querySelector('button').onclick = doSearch;
        inp.onkeydown = (e) => { if (e.key === 'Enter') doSearch(); };
        el.querySelectorAll('.fp').forEach((p) => (p.onclick = () => { filter = p.dataset.f; el.querySelectorAll('.fp').forEach((x) => x.classList.toggle('active', x === p)); renderResults(); }));
        renderInfo();
        return { el, getMain: () => main, getMerge: () => [...merge.values()], setMain: (m) => { main = m; renderResults(); renderInfo(); }, setMerge: (c, on) => { on ? merge.set(c.id, { id: c.id, source: c.source, name: c.name }) : merge.delete(c.id); renderResults(); renderInfo(); } };
      }
      function mkBtn(label, cls, fn) { const b = document.createElement('button'); b.className = cls; b.textContent = label; b.onclick = fn; return b; }
      function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
    </script>
  </body>
</html>
